[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "E402", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query parameters through function defaults.
"app/api/routes.py" = ["B008"]
# conftest adjusts sys.path before importing the application package.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
